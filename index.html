<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <link rel="manifest" href="./manifest.json" />
    <meta name="theme-color" content="#0d9488" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PsynapseCDS | Precision Psychiatric Clinical Decision Support &amp; Simulation</title>
    <script>
      // Clear stale service workers and cache on localhost during development
      if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(registrations) {
            for (var i = 0; i < registrations.length; i++) {
              registrations[i].unregister();
            }
          });
        }
      }
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased min-h-screen font-sans">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
